[project]
name = "sustain-backend"
version = "0.1.0"
description = "FastAPI backend for Sustain Food Donation App"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "email-validator==2.2.0",
    "SQLAlchemy==2.0.41",
    "alembic==1.16.4",
    "python-multipart==0.0.20",
    "Pillow==10.4.0",
    "tensorflow==2.16.1",
    "requests==2.33.1",
    "supabase==2.7.4",
    "psycopg2-binary==2.9.9",
]

[tool.uv]
package = false

